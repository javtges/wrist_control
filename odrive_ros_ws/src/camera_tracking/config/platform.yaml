# platform_pose parameters: the plate's tag layout and the zeroing guard.
platform_pose:
  ros__parameters:
    detections_topic: /apriltag/detections
    camera_info_topic: /tracking_cam/camera_info
    joint_states_topic: /hsa_odrive_control/joint_states
    camera_frame: camera            # usb_cam frame_id (TF parent of everything)
    platform_frame: platform
    zero_frame: platform_zero

    # Tag layout in the ID0 frame (x right, y up along the printed tag), mm.
    # ID1 straight above ID0, ID2 lower right, ID3 lower left, 120 degrees apart.
    # The drawing says 40 mm centre to centre at exactly 120 degrees. ID1 and ID2
    # come from the centre-to-centre distances measured with the calibrated camera
    # (2026-10-20, 906 frames, tags verified 12.0 mm): ID0-ID1 38.95, ID0-ID2 39.05,
    # ID1-ID2 68.04 mm, so ID1 at 38.95 mm on +y and ID2 at 39.05 mm, 121.5 deg from it.
    # Distances are used rather than single-tag poses because a 12 mm tag's tilt is
    # ambiguous and biases per-tag positions by 1-2 mm. ID3 is never in frame in the
    # approved mounting, so it keeps the nominal 39 mm / 210 deg. All four tags are
    # printed with the same orientation.
    tag_size: 0.012                 # edge of the black square, m (12 mm tag, 18 mm with border)
    tag_ids:  [0,   1,    2,       3]
    tag_x_mm: [0.0, 0.0,   33.31, -33.775]
    tag_y_mm: [0.0, 38.95, -20.38, -19.5]
    tag_priority: [0, 1, 2, 3]      # ID0 when visible, else the first visible outer tag
    pose_source: all                # all = anchor on the priority tag, refine over every visible tag's
                                    # corners (a 70 mm baseline pins the tilt a lone 12 mm tag cannot);
                                    # priority = that one tag only

    max_age: 0.1                    # s, the pose must be this fresh to become the zero
    stale_after: 1.0                # s without detections before "not visible"
    zero_file: ~/.config/camera_tracking/platform_zero.yaml

    # /set_platform_zero is refused unless every HSA extension angle is within
    # joints_zero_tol_deg of 0 (fresh within joints_max_age). false = no guard.
    require_joints_zero: true
    joints_zero_tol_deg: 1.0
    joints_max_age: 1.0
    publish_consistency: true       # ~/tag_consistency_mm when >1 tag is visible

# plate_guard: the expected mounting of the top plate, as seen by the camera.
# expected_id1_bearing_deg = where ID1 sits around the plate centre, degrees
# clockwise from the top of the image (12 o'clock = 0, 3 o'clock = 90); the
# other tags follow from the layout. Measured 2026-10-20 on the approved mounting:
# ID1 at 9 o'clock, ID2 at 1 o'clock, ID3 at the bottom (clipped). Re-measure with
# plate_check if the camera is remounted.
plate_guard:
  ros__parameters:
    detections_topic: /apriltag/detections
    tag_size: 0.012
    tag_ids:  [0,   1,    2,       3]
    tag_x_mm: [0.0, 0.0,   33.31, -33.775]
    tag_y_mm: [0.0, 38.95, -20.38, -19.5]
    expected_id1_bearing_deg: 283.5
    tolerance_deg: 15.0
    stale_after: 1.0
    warn_period: 5.0
    rate: 2.0
