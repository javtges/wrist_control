# AprilTagNode parameters (apriltag_ros 3.x nested format) for the platform tags:
# family 16h5, ids 0-3, 12 mm black square (18 mm with the white border).
# 16h5 has few bits, so keep max_hamming 0 and restrict ids to the plate's four.
/**:
  ros__parameters:
    image_transport: raw
    family: 16h5
    size: 0.012               # tag edge in metres (black border to black border)
    max_hamming: 0
    pose_estimation_method: pnp

    detector:
      threads: 4
      decimate: 2.0           # quad search at half resolution keeps up with the camera;
                              # set 1.0 if the 12 mm tags are missed (corners are always
                              # refined at full resolution)
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false

    # Only the plate's tags; frames are tag16h5:<id> (platform_pose does its own
    # PnP from the detections and does not use these TFs).
    tag:
      ids: [0, 1, 2, 3]
      sizes: [0.012, 0.012, 0.012, 0.012]
