launch:

- node:
    pkg: "odrive_can"
    exec: "odrive_can_node"
    name: "can_node"
    namespace: "odrive_axis0"
    param:
    -
      name: "node_id"
      value: 0
    -
      name: "interface"
      value: "can0"

- node:
    pkg: "odrive_can"
    exec: "odrive_can_node"
    name: "can_node"
    namespace: "odrive_axis1"
    param:
    -
      name: "node_id"
      value: 1
    -
      name: "interface"
      value: "can0"

- node:
    pkg: "odrive_can"
    exec: "odrive_can_node"
    name: "can_node"
    namespace: "odrive_axis2"
    param:
    -
      name: "node_id"
      value: 2
    -
      name: "interface"
      value: "can0"

- node:
    pkg: "odrive_can"
    exec: "odrive_can_node"
    name: "can_node"
    namespace: "odrive_axis3"
    param:
    -
      name: "node_id"
      value: 3
    -
      name: "interface"
      value: "can0"

- node:
    pkg: "odrive_can"
    exec: "odrive_can_node"
    name: "can_node"
    namespace: "odrive_axis4"
    param:
    -
      name: "node_id"
      value: 4
    -
      name: "interface"
      value: "can0"

- node:
    pkg: "odrive_can"
    exec: "odrive_can_node"
    name: "can_node"
    namespace: "odrive_axis5"
    param:
    -
      name: "node_id"
      value: 5
    -
      name: "interface"
      value: "can0"

- node:
    pkg: "wrist_control"
    exec: "odrive_position_monitor"
    name: "odrive_position_monitor"
    param:
    -
      name: "num_axes"
      value: 6
    -
      name: "publish_rate"
      value: 20.0

- node:
    pkg: "wrist_control"
    exec: "hsa_odrive_control"
    name: "hsa_odrive_control"
