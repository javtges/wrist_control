[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hsa_robots"
version = "0.1.0"
description = "HSA robot kinematics library"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml"]

[tool.setuptools.packages.find]
where = [".."]
include = ["hsa_robots*"]
