# HSARobot configuration
# Each entry defines one HSA actuator in the robot.
# handedness: CW or CCW
# min_angle:  minimum extension angle (degrees)
# max_angle:  maximum extension angle (degrees)
# zero_point: resting/home extension angle (degrees)
# gear_ratio: gear ratio of the actuator (wrists have a 2:1 gear ratio)

hsas:
  - handedness: CCW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    index: 0
    motor: odrive
    gear_ratio: 2.0

  - handedness: CCW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    index: 1
    motor: odrive
    gear_ratio: 2.0

  - handedness: CCW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    index: 2
    motor: odrive
    gear_ratio: 2.0

  - handedness: CCW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    index: 3
    motor: odrive
    gear_ratio: 2.0

  - handedness: CCW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    index: 4
    motor: odrive
    gear_ratio: 2.0

  - handedness: CCW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    index: 5
    motor: odrive
    gear_ratio: 2.0