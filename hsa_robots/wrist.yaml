# HSARobot configuration
# Each entry defines one HSA actuator in the robot.
# handedness: CW or CCW
# min_angle:  minimum extension angle (degrees)
# max_angle:  maximum extension angle (degrees)
# zero_point: resting/home extension angle (degrees)
# gear_ratio: gear ratio of the actuator (wrists have a 2:1 gear ratio)
# zero_offset: software zero (motor turns), added to the raw ODrive position so
#             zero_point is the physical zero. Written by joint_commander_gui's
#             "Set Physical Zero"; only valid while the ODrive positions are
#             unchanged since it was set (see wrist_control doc/running.md)

hsas:
  - handedness: CW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    zero_offset: 0.0
    index: 0
    motor: odrive
    gear_ratio: 2.0

  - handedness: CW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    zero_offset: 0.0
    index: 1
    motor: odrive
    gear_ratio: 2.0

  - handedness: CW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    zero_offset: 0.0
    index: 2
    motor: odrive
    gear_ratio: 2.0

  - handedness: CW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    zero_offset: 0.0
    index: 3
    motor: odrive
    gear_ratio: 2.0

  - handedness: CW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    zero_offset: 0.0
    index: 4
    motor: odrive
    gear_ratio: 2.0

  - handedness: CW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    zero_offset: 0.0
    index: 5
    motor: odrive
    gear_ratio: 2.0