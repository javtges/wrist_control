# HSARobot configuration
# Each entry defines one HSA actuator in the robot.
# handedness: CW or CCW
# min_angle:  minimum extension angle (degrees)
# max_angle:  maximum extension angle (degrees)
# zero_point: resting/home extension angle (degrees)

hsas:
  - handedness: CW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    index: 0
    motor: servo

  - handedness: CCW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    index: 1
    motor: servo

  - handedness: CW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    index: 2
    motor: servo

  - handedness: CCW
    min_angle: 0.0
    max_angle: 360.0
    zero_point: 0.0
    index: 3
    motor: servo